music_directory     "/home/arduino/music"
playlist_directory  "/home/arduino/mpd/playlists"
db_file             "/home/arduino/mpd/database"
log_file            "/home/arduino/mpd/log"
state_file          "/home/arduino/mpd/state"
sticker_file        "/home/arduino/mpd/sticker.sql"

user                "arduino"
bind_to_address     "any"
port                "6600"
auto_update         "yes"
zeroconf_enabled    "yes"
zeroconf_name       "UNO Q MPD"

# Everything goes out as 16/44.1 into the shared FIFO. MPD does the
# resampling (soxr) and dithering for hi-res sources.
audio_output {
    type        "fifo"
    name        "bridge"
    path        "/home/arduino/audio.fifo"
    format      "44100:16:2"
    mixer_type  "software"      # phone volume works; 100 % is bit-transparent
}

resampler {
    plugin  "soxr"
    quality "very high"
}

decoder {
    plugin  "mpg123"
    enabled "no"
}

decoder {
    plugin  "mad"
    enabled "no"
}
